<div class="best-sellers-container">
  <div class="best-sellers-grid">
    <div *ngFor="let product of products" class="best-seller-card" [routerLink]="['/product', product.id]">
      <div class="bs-image-container">
        <img [src]="product.imageUrls[0]" alt="{{ product.name }}" class="bs-product-image">
        <div *ngIf="product.badge" class="bs-badge">{{ product.badge }}</div>
      </div>
      
      <div class="bs-product-info">
        <p class="bs-product-category">{{ product.subtitle }}</p>
        <h3 class="bs-product-name">{{ product.name }}</h3>
        
        <div class="bs-rating-box" *ngIf="product.rating">
          <span class="bs-stars">★★★★★</span>
          <span class="bs-review-count">{{ product.reviewCount }} Reviews</span>
        </div>
        
        <div class="bs-price-container">
          <span class="bs-original-price">$904.21</span>
          <span class="bs-sale-price">${{ product.price | number:'1.2-2' }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
